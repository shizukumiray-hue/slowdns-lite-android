name: Build SlowDNS Lite APK (ARMv7 & ARMv8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go-core:
    name: Build Go Core AAR (ARMv7 + ARMv8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install GoMobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Compile Go Core to AAR
        working-directory: core
        run: |
          go mod tidy
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -o ../app/libs/TunnelCore.aar .

      - name: Upload Core AAR
        uses: actions/upload-artifact@v4
        with:
          name: TunnelCore-aar
          path: app/libs/TunnelCore.aar

  build-apk:
    name: Build APK (v7, v8 & Universal)
    needs: build-go-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Download Core AAR
        uses: actions/download-artifact@v4
        with:
          name: TunnelCore-aar
          path: app/libs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          python3 -c "import base64, os; open('app/release.keystore', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"

      - name: Build Signed APKs (v7, v8, universal)
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: gradle assembleRelease --stacktrace

      - name: Organize APK Files
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*arm64-v8a*.apk" -exec cp {} dist/SlowDNS-Lite-arm64-v8a.apk \;
          find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -exec cp {} dist/SlowDNS-Lite-armeabi-v7a.apk \;
          find app/build/outputs/apk/release -name "*universal*.apk" -exec cp {} dist/SlowDNS-Lite-universal.apk \;
          ls -la dist/

      - name: Upload Artifacts (Individual Files)
        uses: actions/upload-artifact@v4
        with:
          name: slowdns-lite-individual-apks
          path: dist/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SlowDNS Lite v1.0.${{ github.run_number }} (Signed)"
          draft: false
          prerelease: false
          body: |
            ### 🚀 Unduh APK SlowDNS Lite (Signed Resmi):
            Pilih APK sesuai arsitektur HP kamu:
            - **[SlowDNS-Lite-arm64-v8a.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SlowDNS-Lite-arm64-v8a.apk)**: HP Android 64-bit modern (Rekomendasi).
            - **[SlowDNS-Lite-armeabi-v7a.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SlowDNS-Lite-armeabi-v7a.apk)**: HP Android 32-bit.
            - **[SlowDNS-Lite-universal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SlowDNS-Lite-universal.apk)**: Semua perangkat Android.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
